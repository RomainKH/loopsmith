name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift build
      - run: swift test

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2.4-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
