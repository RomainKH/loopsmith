name: Release

# Push a tag that matches the version in Sources/Loopsmith/Entry.swift: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the tag against the app version
        run: |
          version="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/Loopsmith/Entry.swift)"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME, app version $version"; exit 1; }
      - run: ./scripts/build-app.sh --universal --zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Loopsmith-macos.zip

  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2.4-noble
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: build/loopsmith-linux-*.tar.gz

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Loopsmith ${GITHUB_REF_NAME#v}" --generate-notes
